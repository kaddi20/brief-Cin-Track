<!Doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <title>CinéTrack</title>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col">
    <!--header-->
    <header class="w-full bg-gray-800 px-4 py-5 sm:px-8">
        <h1 class="text-2xl text-white font-bold sm:2xl">CinéTrack</h1>
    </header>
    <div class="flex min-h-screen ">
        <main class="w-full">
            <section class="flex flex-col md:flex-row gap-3 px-3 py-3">
                <input type="text" id="search" placeholder="Rechercher un titre..."  class="w-[35%] bg-gray-800 text-white rounded-2xl px-3">    
                <div class="flex items-center gap-3">
                    <button data-filtre="tous" class="filtre-btn bg-gray-800 text-white rounded-2xl px-3 py-3">Tous</button>
                    <button data-filtre="film" class="filtre-btn bg-gray-800 text-white rounded-2xl px-3 py-3">Film</button>
                    <button data-filtre="Movie" class="filtre-btn bg-gray-800 text-white rounded-2xl px-3 py-3">Movie</button>
                </div>
            </section>
        </main>
        <aside id="favaorites-sidebar" class="w-[30%] flex flex-col bg-slate-800 border-l border-gray-700 p-6 ">
            <h2>Favorites</h2>
        </aside>    
    </div>
    
     <script type="module" src="./js/main-cinetrack.js"></script>
    
</body>
</html>
